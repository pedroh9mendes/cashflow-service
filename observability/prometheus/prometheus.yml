global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: lancamentos-api
    metrics_path: /metrics
    static_configs:
      - targets: ["lancamentos-api:8080"]
        labels:
          servico: lancamentos

  - job_name: consolidado-api
    metrics_path: /metrics
    static_configs:
      - targets: ["consolidado-api:8080"]
        labels:
          servico: consolidado
